name: Build Docker Image

on:
  workflow_run:
    workflows: ["Generate and Store RSA Keys"]
    types:
      - completed

jobs:
  set_image_tag:
    name: Set Image Tag
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: true

    outputs:
      IMAGE_TAG: ${{ steps.get_image_tag.outputs.IMAGE_TAG }}
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - id: get_image_tag
        run: echo "IMAGE_TAG=sha-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

  # Build para amd64
  build_amd64:
    name: Build Docker Image amd64
    runs-on: ubuntu-latest
    needs: set_image_tag

    env:
      DOCKER_REGISTRY: docker.io
      DOCKER_IMAGE: ${{ secrets.IMAGE_NAME }}
      DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      IMAGE_NAME_FINAL: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.IMAGE_NAME }}
      IMAGE_TAG: ${{ needs.set_image_tag.outputs.IMAGE_TAG }}

    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME_FINAL }}:amd64,${{ env.IMAGE_NAME_FINAL }}:latest-amd64

  # Build para arm64
  build_arm64:
    name: Build Docker Image arm64
    runs-on: self-hosted
    needs: [build_amd64, set_image_tag]

    env:
      DOCKER_REGISTRY: docker.io
      DOCKER_IMAGE: ${{ secrets.IMAGE_NAME }}
      DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      IMAGE_NAME_FINAL: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.IMAGE_NAME }}
      IMAGE_TAG: ${{ needs.set_image_tag.outputs.IMAGE_TAG }}

    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME_FINAL }}:arm64,${{ env.IMAGE_NAME_FINAL }}:latest-arm64

  # Build para arm64
  build_arm64v8:
    name: Build Docker Image arm64v8
    runs-on: self-hosted
    needs: [build_arm64, set_image_tag]

    env:
      DOCKER_REGISTRY: docker.io
      DOCKER_IMAGE: ${{ secrets.IMAGE_NAME }}
      DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      IMAGE_NAME_FINAL: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.IMAGE_NAME }}
      IMAGE_TAG: ${{ needs.set_image_tag.outputs.IMAGE_TAG }}

    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64/v8
          push: true
          tags: ${{ env.IMAGE_NAME_FINAL }}:arm64-v8, ${{ env.IMAGE_NAME_FINAL }}:latest-arm64-v8

  push_manifest:
    name: Push Multi-Arch Manifest
    runs-on: ubuntu-latest
    needs: [build_amd64, build_arm64, build_arm64v8, set_image_tag]

    env:
      DOCKER_REGISTRY: docker.io
      DOCKER_IMAGE: ${{ secrets.IMAGE_NAME }}
      DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      IMAGE_NAME_FINAL: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.IMAGE_NAME }}
      IMAGE_TAG: ${{ needs.set_image_tag.outputs.IMAGE_TAG }}

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create multi-arch manifest
        uses: int128/docker-manifest-create-action@v2
        with:
          tags: |
            ${{ env.IMAGE_NAME_FINAL }}:${{ env.IMAGE_TAG }}
          sources: |
            ${{ env.IMAGE_NAME_FINAL }}:amd64
            ${{ env.IMAGE_NAME_FINAL }}:arm64
            ${{ env.IMAGE_NAME_FINAL }}:arm64-v8

      - name: Create latest manifest
        uses: int128/docker-manifest-create-action@v2
        with:
          tags: |
            ${{ env.IMAGE_NAME_FINAL }}:latest
          sources: |
            ${{ env.IMAGE_NAME_FINAL }}:latest-amd64
            ${{ env.IMAGE_NAME_FINAL }}:latest-arm64
            ${{ env.IMAGE_NAME_FINAL }}:latest-arm64-v8
