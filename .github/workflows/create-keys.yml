name: Generate and Store RSA Keys

on:
  push:
    branches:
      - pre

jobs:
  setup-keys:
    runs-on: self-hosted

    env:
      APP_NAME: ${{ secrets.APP_NAME }}

    steps:
      - name: Verificar y generar claves
        run: |
          set -e  # Salir en caso de error

          BASE_DIR="/home/ubuntu/certs/${APP_NAME}"
          KEY_DIR="${BASE_DIR}/keys"
          ENV_FILE="${BASE_DIR}/.env"

          echo "🔎 Verificando existencia de $BASE_DIR"

          if [ ! -d "$BASE_DIR" ]; then
            echo "📁 No existe $BASE_DIR. Creándolo..."
            mkdir -p "$BASE_DIR"
          else
            echo "✔️ Carpeta de claves $BASE_DIR ya existe."
          fi

          if [ ! -d "$KEY_DIR" ]; then
            echo "📁 No existe $KEY_DIR. Creándolo..."
            mkdir -p "$KEY_DIR"
          else
            echo "✔️ Carpeta de claves $KEY_DIR ya existe."
          fi

          # Verificar existencia de claves
          if [ -f "$KEY_DIR/private.pem" ] && [ -f "$KEY_DIR/public.pem" ]; then
            echo "✅ Las claves ya existen en $KEY_DIR. No se regeneran."
          else
            echo "🔐 Claves no encontradas. Generando nuevas..."

            # Generar passphrase solo si no existe .env
            if [ ! -f "$ENV_FILE" ]; then
              PASSPHRASE=$(openssl rand -base64 32)
              echo "PASSWORD_PRIVATE_KEY=$PASSPHRASE" > "$ENV_FILE"
              echo "PATH_PRIVATE_KEY=./keys/private.pem" > "$ENV_FILE"
              echo "🔑 Passphrase generada y guardada en $ENV_FILE"
            else
              echo "🔑 Usando passphrase existente en $ENV_FILE"
              PASSPHRASE=$(grep PASSWORD_PRIVATE_KEY "$ENV_FILE" | cut -d '=' -f2)
            fi

            # Generar claves
            openssl genpkey -algorithm RSA -aes256 -passout pass:$PASSPHRASE -out "$KEY_DIR/private.pem" -pkeyopt rsa_keygen_bits:2048
            openssl rsa -in "$KEY_DIR/private.pem" -passin pass:$PASSPHRASE -pubout -out "$KEY_DIR/public.pem"
            echo "🔐 Claves generadas correctamente en $KEY_DIR"
          fi
